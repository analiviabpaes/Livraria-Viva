<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livraria Viva - Contacto</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo">
            <h1>Livraria Viva</h1>
        </div>
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir Menu">☰</button>
        <nav class="menu" id="menuNav">
            <ul>
                <li><a href="../index.html">Início</a></li>
                <li><a href="livros.html">Catálogo de Livros</a></li>
                <li><a href="contato.html" class="ativo">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="formulario-container">
            <h2>Fale Connosco</h2>
            <p class="subtitulo">Envie-nos uma mensagem e responderemos o mais breve possível.</p>

            <div id="mensagemFeedback" class="feedback"></div>

            <form id="formContato" class="formulario" novalidate>
                <div class="campo">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite o seu nome">
                </div>

                <div class="campo">
                    <label for="email">E-mail de Contacto:</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva aqui a sua mensagem..."></textarea>
                </div>

                <button type="submit" class="botao">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer class="rodape">
        <p>&copy; 2026 Livraria Viva. Todos os direitos reservados.</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
